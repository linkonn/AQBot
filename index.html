    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Match initial background to theme to avoid white flash
      try {
        var m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        if (m && m.matches) document.body.style.backgroundColor = '#0b1420';
      } catch(e) {}
    </script>
  </body>
